name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -r host/requirements.txt
          python -m pip install --no-deps ./host
      - name: Test
        working-directory: host
        run: python -m unittest discover -s tests -t . -v

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build
        working-directory: firmware
        run: pio run
      - name: Check image
        working-directory: firmware
        run: |
          f=.pio/build/ultra/firmware.bin
          size=$(stat -c %s "$f")
          echo "firmware size: $size bytes"
          # must fit next to the stock firmware in its update slot (about 520 KB)
          test "$size" -lt 500000
          # DIO flash mode, 4 MB, like the stock image
          test "$(head -c 4 "$f" | od -An -tx1 | tr -d ' ')" = "e9020240"
          cp "$f" smalltv-live-firmware.bin
          sha256sum smalltv-live-firmware.bin > smalltv-live-firmware.bin.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smalltv-live-firmware
          path: |
            firmware/smalltv-live-firmware.bin
            firmware/smalltv-live-firmware.bin.sha256

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smalltv-live-firmware
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SmallTV Live $TAG" \
            --notes "See CHANGELOG.md for what changed." \
            smalltv-live-firmware.bin smalltv-live-firmware.bin.sha256
