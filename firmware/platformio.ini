; SmallTV Live firmware for the GeekMagic SmallTV-Ultra (ESP-12F, ESP8266, 4 MB flash).
;
; The flash layout matches the stock Ultra firmware (4M3M: 1 MB application, 3 MB LittleFS at 0x100000),
; so the stock file system is left alone and the stock firmware can be flashed back from /update.
; DIO flash mode and 40 MHz, like the stock image header.
;
; Build:  pio run        Output: .pio/build/ultra/firmware.bin

[platformio]
default_envs = ultra

[env:ultra]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m3m.ld
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D NDEBUG
	-D FW_VERSION=\"1.0.0\"
